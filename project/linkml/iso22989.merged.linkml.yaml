    "AicOecdLifecycleStage": {
      "name": "AicOecdLifecycleStage",
      "annotations": {
        "iso22989_clause": {
          "tag": "iso22989_clause",
          "value": "Annex A"
        },
        "oecd_source": {
          "tag": "oecd_source",
          "value": "OECD/LEGAL/0449"
        }
      },
      "description": "A phase of the OECD's account of an AI system's life, which Annex A sets beside the standard's.",
      "comments": [
        "The first six values are the phases the OECD Recommendation on Artificial Intelligence (OECD/LEGAL/0449) named when the standard was published, as the OECD Framework for the Classification of AI Systems (2022) draws them. The Recommendation as revised on 3 May 2024 names seven: it adds retiring or decommissioning, widens building to adapting a model that exists, and widens checking to testing and evaluation. The descriptions follow the revised text, read at legalinstruments.oecd.org on 2026-11-05, and retire_or_decommission is here for a record that follows it.",
        "NIST's AI Risk Management Framework names the first six phases too, with deploy as deploy and use, and lmodel/nist-ai-100-1 renders them, so each maps to NIST's stage by close_mappings."
      ],
      "in_subset": [
        "aic_lifecycle"
      ],
      "from_schema": "https://w3id.org/lmodel/iso22989",
      "permissible_values": {
        "plan_and_design": {
          "text": "plan_and_design",
          "description": "Setting out what the system is for and how it will work.",
          "close_mappings": [
            "nist_ai_100_1:AiRmfLifecycleStageName#plan_and_design"
          ]
        },
        "collect_and_process_data": {
          "text": "collect_and_process_data",
          "description": "Gathering and readying the data.",
          "close_mappings": [
            "nist_ai_100_1:AiRmfLifecycleStageName#collect_and_process_data"
          ]
        },
        "build_and_use_model": {
          "text": "build_and_use_model",
          "description": "Making the model, or adapting one that exists, and trying it on the task.",
          "close_mappings": [
            "nist_ai_100_1:AiRmfLifecycleStageName#build_and_use_model"
          ]
        },
        "verify_and_validate": {
          "text": "verify_and_validate",
          "description": "Testing and evaluating the system, and checking it against what was specified and what it is for.",
          "close_mappings": [
            "nist_ai_100_1:AiRmfLifecycleStageName#verify_and_validate"
          ]
        },
        "deploy": {
          "text": "deploy",
          "description": "Making the system available for use.",
          "close_mappings": [
            "nist_ai_100_1:AiRmfLifecycleStageName#deploy_and_use"
          ]
        },
        "operate_and_monitor": {
          "text": "operate_and_monitor",
          "description": "Running the system and watching how it behaves.",
          "close_mappings": [
            "nist_ai_100_1:AiRmfLifecycleStageName#operate_and_monitor"
          ]
        },
        "retire_or_decommission": {
          "text": "retire_or_decommission",
          "description": "Taking the system out of service, a step that may come at any point while it runs."
        }
      }
    },
