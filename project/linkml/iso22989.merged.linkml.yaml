      "rules": [
        {
          "preconditions": {
            "slot_conditions": {
              "aic_stakeholder_role": {
                "name": "aic_stakeholder_role",
                "equals_string": "ai_provider"
              },
              "aic_stakeholder_sub_roles": {
                "name": "aic_stakeholder_sub_roles",
                "value_presence": "PRESENT"
              }
            }
          },
          "postconditions": {
            "slot_conditions": {
              "aic_stakeholder_sub_roles": {
                "name": "aic_stakeholder_sub_roles",
                "any_of": [
                  {
                    "equals_string": "ai_platform_provider"
                  },
                  {
                    "equals_string": "ai_product_or_service_provider"
                  }
                ]
              }
            }
          },
          "description": "A party in the ai_provider role takes only that role's sub-roles."
        },
        {
          "preconditions": {
            "slot_conditions": {
              "aic_stakeholder_role": {
                "name": "aic_stakeholder_role",
                "equals_string": "ai_producer"
              },
              "aic_stakeholder_sub_roles": {
                "name": "aic_stakeholder_sub_roles",
                "value_presence": "PRESENT"
              }
            }
          },
          "postconditions": {
            "slot_conditions": {
              "aic_stakeholder_sub_roles": {
                "name": "aic_stakeholder_sub_roles",
                "any_of": [
                  {
                    "equals_string": "ai_developer"
                  }
                ]
              }
            }
          },
          "description": "A party in the ai_producer role takes only that role's sub-roles."
        },
        {
          "preconditions": {
            "slot_conditions": {
              "aic_stakeholder_role": {
                "name": "aic_stakeholder_role",
                "equals_string": "ai_customer"
              },
              "aic_stakeholder_sub_roles": {
                "name": "aic_stakeholder_sub_roles",
                "value_presence": "PRESENT"
              }
            }
          },
          "postconditions": {
            "slot_conditions": {
              "aic_stakeholder_sub_roles": {
                "name": "aic_stakeholder_sub_roles",
                "any_of": [
                  {
                    "equals_string": "ai_user"
                  }
                ]
              }
            }
          },
          "description": "A party in the ai_customer role takes only that role's sub-roles."
        },
        {
          "preconditions": {
            "slot_conditions": {
              "aic_stakeholder_role": {
                "name": "aic_stakeholder_role",
                "equals_string": "ai_partner"
              },
              "aic_stakeholder_sub_roles": {
                "name": "aic_stakeholder_sub_roles",
                "value_presence": "PRESENT"
              }
            }
          },
          "postconditions": {
            "slot_conditions": {
              "aic_stakeholder_sub_roles": {
                "name": "aic_stakeholder_sub_roles",
                "any_of": [
                  {
                    "equals_string": "ai_system_integrator"
                  },
                  {
                    "equals_string": "data_provider"
                  }
                ]
              }
            }
          },
          "description": "A party in the ai_partner role takes only that role's sub-roles."
        },
        {
          "preconditions": {
            "slot_conditions": {
              "aic_stakeholder_role": {
                "name": "aic_stakeholder_role",
                "equals_string": "ai_subject"
              },
              "aic_stakeholder_sub_roles": {
                "name": "aic_stakeholder_sub_roles",
                "value_presence": "PRESENT"
              }
            }
          },
          "postconditions": {
            "slot_conditions": {
              "aic_stakeholder_sub_roles": {
                "name": "aic_stakeholder_sub_roles",
                "any_of": [
                  {
                    "equals_string": "data_subject"
                  },
                  {
                    "equals_string": "other_subject"
                  }
                ]
              }
            }
          },
          "description": "A party in the ai_subject role takes only that role's sub-roles."
        },
        {
          "preconditions": {
            "slot_conditions": {
              "aic_stakeholder_role": {
                "name": "aic_stakeholder_role",
                "equals_string": "relevant_authority"
              },
              "aic_stakeholder_sub_roles": {
                "name": "aic_stakeholder_sub_roles",
                "value_presence": "PRESENT"
              }
            }
          },
          "postconditions": {
            "slot_conditions": {
              "aic_stakeholder_sub_roles": {
                "name": "aic_stakeholder_sub_roles",
                "any_of": [
                  {
                    "equals_string": "policy_maker"
                  },
                  {
                    "equals_string": "regulator"
                  }
                ]
              }
            }
          },
          "description": "A party in the relevant_authority role takes only that role's sub-roles."
        }
      ]
