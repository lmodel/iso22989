syntax = "proto3";
package iso22989;
// metamodel_version: 1.12.0
// version: 2022
// What was done because of a decision.
message AicAction {
  // The decision it carries out.
  AicDecision aic_action_decision = 1;
  // What it acted on.
  string aic_action_target = 2;
  // When it was done.
  string aic_action_time = 3;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 4;
  // The name the record's author gives it.
  string title = 5;
  // What the record describes, in its author's words.
  string description = 6;
}
// A system that perceives its surroundings and acts on them in pursuit of goals.
message AicAgent {
  // Which class this record is: AicSystem or a kind of it.
  string aic_system_type = 1;
  // What the system is meant to do.
  string aic_system_purpose = 2;
  // How wide a range of problems the system can take on.
  AicSystemScope aic_system_scope = 3;
  // Whether it works symbolically, subsymbolically or both ways.
  repeated AicApproach aic_system_approaches = 4;
  // The families of technique it is built with.
  repeated AicTechnique aic_system_techniques = 5;
  // Whether it runs without a person acting at each step, under the conditions given.
  bool aic_system_automated = 6;
  // Whether it can change its own remit or stays under outside direction.
  AicAutonomy aic_system_autonomy = 7;
  // How people and the system share the work, if they do.
  string aic_system_human_teaming = 8;
  // The stage of its life the system is in now.
  AicLifecycleStage aic_system_stage = 9;
  // The fields of AI it belongs to.
  repeated AicField aic_system_fields = 10;
  // The steps from data to action that it performs.
  repeated AicFunctionalStep aic_system_steps = 11;
  // The parts it is made of.
  repeated AicComponent aic_system_components = 12;
  // The models it uses.
  repeated AicModel aic_system_models = 13;
  // The datasets it uses.
  repeated AicDataset aic_system_datasets = 14;
  // The tasks it takes on.
  repeated AicTask aic_system_tasks = 15;
  // The parties around it.
  repeated AicStakeholder aic_system_stakeholders = 16;
  // The computing resources it runs on.
  repeated AicResourcePool aic_system_resource_pools = 17;
  // The legal questions that follow from where it is built, offered or used.
  repeated string aic_system_jurisdictional_issues = 18;
  // The effects it may have on people and society beyond its users.
  repeated string aic_system_societal_impacts = 19;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 20;
  // The name the record's author gives it.
  string title = 21;
  // What the record describes, in its author's words.
  string description = 22;
  // The goals the agent pursues.
  repeated string aic_agent_goals = 23;
  // The surroundings the agent perceives and acts on.
  string aic_agent_environment = 24;
}
// One use of a system in a line of work.
message AicApplication {
  // The system applied.
  AicSystem aic_application_system = 1;
  // The domain, where it is one the standard works through.
  AicApplicationDomain aic_application_domain = 2;
  // The sector, in the words of whoever keeps the record.
  string aic_application_sector = 3;
  // What this use is for.
  string aic_application_purpose = 4;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 5;
  // The name the record's author gives it.
  string title = 6;
  // What the record describes, in its author's words.
  string description = 7;
}
// One verification or validation of a system.
message AicAssessment {
  // Whether it checks the system against its specification or against its purpose.
  AicAssessmentKind aic_assessment_kind = 1;
  // The system assessed.
  AicSystem aic_assessment_system = 2;
  // How the system was assessed.
  string aic_assessment_method = 3;
  // What the assessment found.
  string aic_assessment_result = 4;
  // When it was done.
  string aic_assessment_date = 5;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 6;
  // The name the record's author gives it.
  string title = 7;
  // What the record describes, in its author's words.
  string description = 8;
}
// A part of a system that does one job in it.
message AicComponent {
  // The step from data to action this part performs.
  AicFunctionalStep aic_component_step = 1;
  // The other parts this part needs.
  repeated AicComponent aic_component_depends_on = 2;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 3;
  // The name the record's author gives it.
  string title = 4;
  // What the record describes, in its author's words.
  string description = 5;
}
// Computing and physical processes tied in a loop, each affecting the other.
message AicCyberPhysicalSystem {
  // The physical processes it senses and controls.
  repeated string aic_cps_physical_processes = 1;
  // The connected system it runs on, if it does.
  AicIotSystem aic_cps_iot_system = 2;
  // The AI systems that work with it.
  repeated AicSystem aic_cps_ai_systems = 3;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 4;
  // The name the record's author gives it.
  string title = 5;
  // What the record describes, in its author's words.
  string description = 6;
}
// One piece of work done on a dataset.
message AicDataProcess {
  // The kind of work.
  AicDataProcessKind aic_data_process_kind = 1;
  // How it was done, such as the tool used.
  string aic_data_process_method = 2;
  // When it was done.
  string aic_data_process_date = 3;
}
// A set of data kept together in one format.
message AicDataset {
  // What the dataset is used for.
  repeated AicDatasetRole aic_dataset_roles = 1;
  // Where the data comes from.
  string aic_dataset_source = 2;
  // How many samples it holds.
  int32 aic_dataset_sample_count = 3;
  // The labels its samples can carry.
  repeated string aic_dataset_labels = 4;
  // Where the correct answers for its samples come from.
  string aic_dataset_ground_truth = 5;
  // Whether it holds data that can identify a person.
  bool aic_dataset_holds_pii = 6;
  // The work done on the data.
  repeated AicDataProcess aic_dataset_processes = 7;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 8;
  // The name the record's author gives it.
  string title = 9;
  // What the record describes, in its author's words.
  string description = 10;
}
// A choice made on the strength of some predictions.
message AicDecision {
  // What was chosen.
  string aic_decision_outcome = 1;
  // The predictions it rests on.
  repeated AicPrediction aic_decision_predictions = 2;
  // How the choice was made, such as a threshold or a rule.
  string aic_decision_criteria = 3;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 4;
  // The name the record's author gives it.
  string title = 5;
  // What the record describes, in its author's words.
  string description = 6;
}
// The AI systems around one context of use, with the data, resources and parties that surround them, each kind of record in a list of its own.
message AicEcosystem {
  // The AI systems.
  repeated AicSystem aic_ecosystem_systems = 1;
  // The parts of those systems.
  repeated AicComponent aic_ecosystem_components = 2;
  // The bodies of knowledge those systems draw on.
  repeated AicKnowledge aic_ecosystem_knowledge = 3;
  // The tasks those systems take on.
  repeated AicTask aic_ecosystem_tasks = 4;
  // The models those systems use.
  repeated AicModel aic_ecosystem_models = 5;
  // The datasets those systems and models use.
  repeated AicDataset aic_ecosystem_datasets = 6;
  // The parties around those systems.
  repeated AicStakeholder aic_ecosystem_stakeholders = 7;
  // The work done at each stage of those systems' lives.
  repeated AicLifecycleProcess aic_ecosystem_lifecycle_processes = 8;
  // The trustworthiness claims made for those systems.
  repeated AicTrustworthinessClaim aic_ecosystem_claims = 9;
  // The verification and validation of those systems.
  repeated AicAssessment aic_ecosystem_assessments = 10;
  // The predictions those systems produced.
  repeated AicPrediction aic_ecosystem_predictions = 11;
  // The decisions taken on those predictions.
  repeated AicDecision aic_ecosystem_decisions = 12;
  // The actions taken on those decisions.
  repeated AicAction aic_ecosystem_actions = 13;
  // Where those systems are applied.
  repeated AicApplication aic_ecosystem_applications = 14;
  // The computing resources those systems run on.
  repeated AicResourcePool aic_ecosystem_resource_pools = 15;
  // The connected devices in the ecosystem.
  repeated AicIotDevice aic_ecosystem_iot_devices = 16;
  // The connected systems in the ecosystem.
  repeated AicIotSystem aic_ecosystem_iot_systems = 17;
  // The cyber-physical systems in the ecosystem.
  repeated AicCyberPhysicalSystem aic_ecosystem_cyber_physical_systems = 18;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 19;
  // The name the record's author gives it.
  string title = 20;
  // What the record describes, in its author's words.
  string description = 21;
}
// A system that puts what human specialists know into a form it can reason with.
message AicExpertSystem {
  // Which class this record is: AicSystem or a kind of it.
  string aic_system_type = 1;
  // What the system is meant to do.
  string aic_system_purpose = 2;
  // How wide a range of problems the system can take on.
  AicSystemScope aic_system_scope = 3;
  // Whether it works symbolically, subsymbolically or both ways.
  repeated AicApproach aic_system_approaches = 4;
  // The families of technique it is built with.
  repeated AicTechnique aic_system_techniques = 5;
  // Whether it runs without a person acting at each step, under the conditions given.
  bool aic_system_automated = 6;
  // Whether it can change its own remit or stays under outside direction.
  AicAutonomy aic_system_autonomy = 7;
  // How people and the system share the work, if they do.
  string aic_system_human_teaming = 8;
  // The stage of its life the system is in now.
  AicLifecycleStage aic_system_stage = 9;
  // The fields of AI it belongs to.
  repeated AicField aic_system_fields = 10;
  // The steps from data to action that it performs.
  repeated AicFunctionalStep aic_system_steps = 11;
  // The parts it is made of.
  repeated AicComponent aic_system_components = 12;
  // The models it uses.
  repeated AicModel aic_system_models = 13;
  // The datasets it uses.
  repeated AicDataset aic_system_datasets = 14;
  // The tasks it takes on.
  repeated AicTask aic_system_tasks = 15;
  // The parties around it.
  repeated AicStakeholder aic_system_stakeholders = 16;
  // The computing resources it runs on.
  repeated AicResourcePool aic_system_resource_pools = 17;
  // The legal questions that follow from where it is built, offered or used.
  repeated string aic_system_jurisdictional_issues = 18;
  // The effects it may have on people and society beyond its users.
  repeated string aic_system_societal_impacts = 19;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 20;
  // The name the record's author gives it.
  string title = 21;
  // What the record describes, in its author's words.
  string description = 22;
  // The bodies of knowledge the system reasons with.
  repeated AicKnowledge aic_expert_knowledge = 23;
  // How the system draws conclusions from that knowledge.
  string aic_expert_inference = 24;
}
// A connected device that reads from or acts on its physical surroundings.
message AicIotDevice {
  // What the device reads from its surroundings.
  repeated string aic_device_senses = 1;
  // What the device acts on.
  repeated string aic_device_actuates = 2;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 3;
  // The name the record's author gives it.
  string title = 4;
  // What the record describes, in its author's words.
  string description = 5;
}
// A networked system that links devices and offers services built on them.
message AicIotSystem {
  // The devices in it.
  repeated AicIotDevice aic_iot_devices = 1;
  // The AI systems that work with it.
  repeated AicSystem aic_iot_ai_systems = 2;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 3;
  // The name the record's author gives it.
  string title = 4;
  // What the record describes, in its author's words.
  string description = 5;
}
// A body of what a system knows, in a form it can use.
message AicKnowledge {
  // Whether it states what is the case or what to do.
  AicKnowledgeKind aic_knowledge_kind = 1;
  // The form it is held in, such as rules, a graph or an ontology.
  string aic_knowledge_representation = 2;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 3;
  // The name the record's author gives it.
  string title = 4;
  // What the record describes, in its author's words.
  string description = 5;
}
// A piece of work done at one stage of a system's life.
message AicLifecycleProcess {
  // The stage the work belongs to.
  AicLifecycleStage aic_lifecycle_stage = 1;
  // The system the work is for.
  AicSystem aic_lifecycle_system = 2;
  // What the work starts from.
  repeated string aic_lifecycle_inputs = 3;
  // What the work produces.
  repeated string aic_lifecycle_outputs = 4;
  // The party that answers for the work.
  AicStakeholder aic_lifecycle_responsible = 5;
  // When the work began.
  string aic_lifecycle_start = 6;
  // When the work ended.
  string aic_lifecycle_end = 7;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 8;
  // The name the record's author gives it.
  string title = 9;
  // What the record describes, in its author's words.
  string description = 10;
}
// A model whose numbers were fitted to data by a training run.
message AicMachineLearningModel {
  // Which class this record is: AicModel or a kind of it.
  string aic_model_type = 1;
  // The version of the model, as its makers number it.
  string aic_model_version = 2;
  // What the model stands for, such as a process or a body of data.
  string aic_model_represents = 3;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 4;
  // The name the record's author gives it.
  string title = 5;
  // What the record describes, in its author's words.
  string description = 6;
  // How the model learned from its data.
  AicLearningParadigm aic_ml_paradigm = 7;
  // The family of algorithm that fitted it.
  AicAlgorithmFamily aic_ml_algorithm = 8;
  // The datasets used to fit, tune and test it.
  repeated AicDataset aic_ml_datasets = 9;
  // The settings fixed before training, each as name=value.
  repeated string aic_ml_hyperparameters = 10;
  // How many numbers training fitted.
  int32 aic_ml_parameter_count = 11;
  // When the last training run ended.
  string aic_ml_trained_on = 12;
  // The earlier model that this one updates by training it again on other data.
  AicMachineLearningModel aic_ml_retrained_from = 13;
  // Whether it goes on learning in small steps while in use.
  bool aic_ml_continuous_learning = 14;
}
// A representation of something, made so that a system can compute with it.
message AicModel {
  // Which class this record is: AicModel or a kind of it.
  string aic_model_type = 1;
  // The version of the model, as its makers number it.
  string aic_model_version = 2;
  // What the model stands for, such as a process or a body of data.
  string aic_model_represents = 3;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 4;
  // The name the record's author gives it.
  string title = 5;
  // What the record describes, in its author's words.
  string description = 6;
}
// A kind of machine learning model built from layers of simple connected units.
message AicNeuralNetworkModel {
  // Which class this record is: AicModel or a kind of it.
  string aic_model_type = 1;
  // The version of the model, as its makers number it.
  string aic_model_version = 2;
  // What the model stands for, such as a process or a body of data.
  string aic_model_represents = 3;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 4;
  // The name the record's author gives it.
  string title = 5;
  // What the record describes, in its author's words.
  string description = 6;
  // How the model learned from its data.
  AicLearningParadigm aic_ml_paradigm = 7;
  // The family of algorithm that fitted it.
  AicAlgorithmFamily aic_ml_algorithm = 8;
  // The datasets used to fit, tune and test it.
  repeated AicDataset aic_ml_datasets = 9;
  // The settings fixed before training, each as name=value.
  repeated string aic_ml_hyperparameters = 10;
  // How many numbers training fitted.
  int32 aic_ml_parameter_count = 11;
  // When the last training run ended.
  string aic_ml_trained_on = 12;
  // The earlier model that this one updates by training it again on other data.
  AicMachineLearningModel aic_ml_retrained_from = 13;
  // Whether it goes on learning in small steps while in use.
  bool aic_ml_continuous_learning = 14;
  // How its layers are connected.
  AicNetworkArchitecture aic_network_architecture = 15;
  // How many layers it has.
  int32 aic_network_layer_count = 16;
  // The functions its units use to turn their inputs into an output.
  repeated string aic_network_activation_functions = 17;
}
// A result a system worked out for one case.
message AicPrediction {
  // The system that produced it.
  AicSystem aic_prediction_system = 1;
  // What it says.
  string aic_prediction_value = 2;
  // How sure the system was, from 0 to 1.
  float aic_prediction_confidence = 3;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 4;
  // The name the record's author gives it.
  string title = 5;
  // What the record describes, in its author's words.
  string description = 6;
}
// What every record has, so that other records can refer to it: an identifier, a title and a description.
message AicRecordMixin {
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 1;
  // The name the record's author gives it.
  string title = 2;
  // What the record describes, in its author's words.
  string description = 3;
}
// A body of computing resource that AI work can draw on.
message AicResourcePool {
  // The kind of resource.
  AicResourceKind aic_pool_kind = 1;
  // The hardware in it, such as a model of accelerator.
  string aic_pool_hardware = 2;
  // How much it offers, in units its owner uses.
  string aic_pool_capacity = 3;
  // The record's identifier, unique among the records it sits with, such as a URI or a CURIE. Other records refer to the record by it.
  string aic_id = 4;
  // The name the record's author gives it.
  string title = 5;
  // What the record describes, in its author's words.
  string description = 6;
}
// A system that moves or acts on physical things through its own actuators.
message AicRobot {
