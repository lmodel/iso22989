subsets:
  terminology:
    name: terminology
    definition_uri: https://w3id.org/lmodel/iso22989/Terminology
    description: Classes and enums representing terms and definitions in Clause 3
      of ISO/IEC 22989:2022 (Terms related to AI, data, machine learning, neural networks,
      trustworthiness, natural-language processing and computer vision).
    from_schema: https://w3id.org/lmodel/iso22989
  ai_concepts:
    name: ai_concepts
    definition_uri: https://w3id.org/lmodel/iso22989/AiConcepts
    description: Conceptual elements introduced in Clause 5 (AI concepts), including
      agent, knowledge, cognition, autonomy, IoT/CPS, trustworthiness, jurisdictional
      and societal-impact concepts.
    from_schema: https://w3id.org/lmodel/iso22989
  ai_lifecycle:
    name: ai_lifecycle
    definition_uri: https://w3id.org/lmodel/iso22989/AiLifecycle
    description: Classes and enums representing the AI system life-cycle model and
      its stages in Clause 6.
    from_schema: https://w3id.org/lmodel/iso22989
  ai_functional_view:
    name: ai_functional_view
    definition_uri: https://w3id.org/lmodel/iso22989/AiFunctionalView
    description: Classes representing the functional view of an AI system in Clause
      7 (data and information, knowledge and learning, prediction/decision/ action
      chain).
    from_schema: https://w3id.org/lmodel/iso22989
  ai_ecosystem:
    name: ai_ecosystem
    definition_uri: https://w3id.org/lmodel/iso22989/AiEcosystem
    description: Ecosystem-level classes in Clause 8 (AI systems, AI functions, ML,
      engineering approaches, data sources, cloud/edge computing and resource pools).
    from_schema: https://w3id.org/lmodel/iso22989
  ai_fields:
    name: ai_fields
    definition_uri: https://w3id.org/lmodel/iso22989/AiFields
    description: Sub-fields of AI introduced in Clause 9 (computer vision, NLP, data
      mining, planning).
    from_schema: https://w3id.org/lmodel/iso22989
  ai_applications_domain:
    name: ai_applications_domain
    definition_uri: https://w3id.org/lmodel/iso22989/AiApplicationsDomain
    description: Application domains presented in Clause 10 (fraud detection, automated
      vehicles, predictive maintenance and similar).
    from_schema: https://w3id.org/lmodel/iso22989
  ai_stakeholders:
    name: ai_stakeholders
    definition_uri: https://w3id.org/lmodel/iso22989/AiStakeholders
    description: AI stakeholder roles enumerated in Clause 5.19 (provider, producer,
      customer, partner, subject, relevant authorities) together with the sub-role
      refinements used by the standard.
    from_schema: https://w3id.org/lmodel/iso22989
  trustworthiness:
    name: trustworthiness
    definition_uri: https://w3id.org/lmodel/iso22989/Trustworthiness
    description: Trustworthiness properties of AI systems as listed in Clause 5.15
      (robustness, reliability, resilience, controllability, explainability, predictability,
      transparency, fairness, bias mitigation).
    from_schema: https://w3id.org/lmodel/iso22989
types:
  ConfidenceScore:
    name: ConfidenceScore
    definition_uri: https://w3id.org/lmodel/iso22989/ConfidenceScore
    description: Numeric confidence score expressed as a value in the closed interval
      [0.0, 1.0]. Used for model prediction confidence, trust scores and similar normalised
      quality indicators.
    from_schema: https://w3id.org/lmodel/iso22989
    typeof: float
    base: float
    uri: xsd:float
    minimum_value: 0.0
    maximum_value: 1.0
  DurationType:
    name: DurationType
    definition_uri: https://w3id.org/lmodel/iso22989/DurationType
    description: ISO 8601 duration value such as P1Y, P30D or PT4H.
    from_schema: https://w3id.org/lmodel/iso22989
    base: str
    uri: xsd:duration
  string:
