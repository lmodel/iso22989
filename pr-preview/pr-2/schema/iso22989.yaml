      knowledge_and_learning:
        text: knowledge_and_learning
        description: Functions producing or maintaining knowledge representations
          and learned models.
      prediction:
        text: prediction
        description: Functions producing predictions from inputs using a trained model
          or knowledge base.
      decision:
        text: decision
        description: Functions selecting a course of action based on predictions and
          constraints.
      action:
        text: action
        description: Functions enacting decisions on the environment or downstream
          systems.
  AIStakeholderRoleType:
    name: AIStakeholderRoleType
    definition_uri: https://w3id.org/lmodel/iso22989/AIStakeholderRoleType
    description: AI stakeholder roles enumerated in Clause 5.19.
    in_subset:
    - ai_stakeholders
    from_schema: https://w3id.org/lmodel/iso22989
    close_mappings:
    - nist_ai_100_1:AiActorTaskEnum
    - nist_ai_600_1:GaiActorTaskEnum
    permissible_values:
      ai_provider:
