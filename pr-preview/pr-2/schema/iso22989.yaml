slots:
  id:
    name: id
    definition_uri: https://w3id.org/lmodel/iso22989/id
    description: Unique CURIE or URI identifying the entity.
    from_schema: https://w3id.org/lmodel/iso22989
    mappings:
    - dcterms:identifier
    slot_uri: dcterms:identifier
    identifier: true
    owner: NamedEntity
    domain_of:
    - NamedEntity
    range: uriorcurie
    required: true
  name:
    name: name
    definition_uri: https://w3id.org/lmodel/iso22989/name
    description: Human-readable label for the entity.
    from_schema: https://w3id.org/lmodel/iso22989
    mappings:
    - schema:name
    exact_mappings:
    - dcterms:title
    - schema:name
    slot_uri: schema:name
    owner: NamedEntity
    domain_of:
    - NamedEntity
    range: string
    required: true
  description:
    name: description
    definition_uri: https://w3id.org/lmodel/iso22989/description
    description: Free-text description of the entity (paraphrased; verbatim ISO text
      excluded).
    from_schema: https://w3id.org/lmodel/iso22989
    mappings:
    - dcterms:description
    slot_uri: dcterms:description
    owner: NamedEntity
    domain_of:
    - NamedEntity
    range: string
  clause_reference:
    name: clause_reference
    definition_uri: https://w3id.org/lmodel/iso22989/clause_reference
    description: ISO/IEC 22989:2022 clause identifier (e.g. "5.11.4") the element
      corresponds to.
    from_schema: https://w3id.org/lmodel/iso22989
    slot_uri: iso22989:clause_reference
    owner: VerificationValidationFramework
    domain_of:
    - NamedEntity
    - AutonomyAssessment
    - VerificationValidationFramework
    range: string
    pattern: ^[0-9]+(\.[0-9]+){0,3}$
  aliases:
    name: aliases
    definition_uri: https://w3id.org/lmodel/iso22989/aliases
    description: Alternative names or synonyms for the term.
    from_schema: https://w3id.org/lmodel/iso22989
    mappings:
    - skos:altLabel
    slot_uri: skos:altLabel
    owner: NamedEntity
    domain_of:
    - NamedEntity
    range: string
    multivalued: true
  preferred_label:
    name: preferred_label
    definition_uri: https://w3id.org/lmodel/iso22989/preferred_label
    description: Preferred natural-language label.
    from_schema: https://w3id.org/lmodel/iso22989
    mappings:
    - skos:prefLabel
    slot_uri: skos:prefLabel
    owner: NamedEntity
    domain_of:
    - NamedEntity
    range: string
  see_also_uri:
    name: see_also_uri
    definition_uri: https://w3id.org/lmodel/iso22989/see_also_uri
    description: Pointers to related external resources or term records.
    from_schema: https://w3id.org/lmodel/iso22989
    mappings:
    - rdfs:seeAlso
    slot_uri: rdfs:seeAlso
    owner: NamedEntity
    domain_of:
    - NamedEntity
    range: uriorcurie
    multivalued: true
  ai_system_type:
    name: ai_system_type
    definition_uri: https://w3id.org/lmodel/iso22989/ai_system_type
    description: Capability classification of the AI system.
    from_schema: https://w3id.org/lmodel/iso22989
    slot_uri: iso22989:ai_system_type
    owner: AISystem
    domain_of:
    - AISystem
    range: AISystemType
  symbolic_approach:
    name: symbolic_approach
    definition_uri: https://w3id.org/lmodel/iso22989/symbolic_approach
