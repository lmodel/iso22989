name: iso22989
annotations:
  standard_reference:
    tag: standard_reference
    value: ISO/IEC 22989:2022(E)
  standard_title:
    tag: standard_title
    value: "Information technology \u2014 Artificial intelligence \u2014 Artificial\
      \ intelligence concepts and terminology"
  standard_edition:
    tag: standard_edition
    value: First edition
  standard_date:
    tag: standard_date
    value: 2022-07
  developing_committee:
    tag: developing_committee
    value: ISO/IEC JTC 1/SC 42 (Artificial Intelligence)
  related_standards:
    tag: related_standards
    value: ISO/IEC 42001 (AI management system); ISO/IEC 23894 (AI risk management
      guidance); ISO/IEC 38507 (Governance implications of AI); ISO/IEC 5338 (AI system
      life cycle process); ISO/IEC 5259 (Data quality for analytics and ML); ISO/IEC
      TR 24028 (Overview of trustworthiness in AI); ISO/IEC TR 24027 (Bias in AI systems
      and AI aided decision making); OECD AI Principles; NIST AI Risk Management Framework
      (AI RMF 1.0)
  rights_notice:
    tag: rights_notice
    value: This project is licensed under Apache-2.0 for original schema structure
      and descriptions. ISO/IEC standards text is owned by ISO/IEC and is not reproduced
      verbatim by this project. Verbatim term definitions, where required by downstream
      consumers, must be supplied through a private overlay file under their own ISO
      licence.
  schema_status:
    tag: schema_status
    value: draft
description: A LinkML schema modelling the artificial-intelligence concepts, terminology,
  life-cycle stages, stakeholder roles, ecosystem components and application domains
  defined in ISO/IEC 22989:2022. The schema supplies the controlled vocabulary referenced
  by sibling lmodel schemas (iso42001 AIMS, iso23894 AI risk management) and supports
  SSSOM mappings to adjacent AI taxonomies.
title: "ISO/IEC 22989:2022: AI Concepts and Terminology \u2014 LinkML Schema"
see_also:
- https://lmodel.github.io/iso22989
- https://www.iso.org/standard/74296.html
