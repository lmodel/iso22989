  EngineeringApproach:
    name: EngineeringApproach
    definition_uri: https://w3id.org/lmodel/iso22989/EngineeringApproach
    description: Non-learning engineering approaches contributing to AI, from Clause
      8.5.
    in_subset:
    - ai_ecosystem
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      expert_system:
        text: expert_system
        description: Rule-based system encoding domain expertise (Clause 8.5.2).
      logic_programming:
        text: logic_programming
        description: Programming paradigm based on formal logic (Clause 8.5.3).
      knowledge_graph:
        text: knowledge_graph
        description: Graph-structured knowledge representation used for reasoning
          and retrieval.
      constraint_satisfaction:
        text: constraint_satisfaction
        description: Solving problems by satisfying a set of declared constraints.
  ComputingResourceType:
    name: ComputingResourceType
    definition_uri: https://w3id.org/lmodel/iso22989/ComputingResourceType
    description: Categories of computing resource used by AI systems, drawn from Clauses
      8.6 (cloud and edge computing) and 8.7 (resource pools).
    in_subset:
    - ai_ecosystem
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      cloud:
        text: cloud
        description: Centralised, elastically provisioned computing resources accessed
          over a network.
      edge:
        text: edge
        description: Computing resources located close to data sources or end users.
      on_premises:
        text: on_premises
        description: Computing resources owned and operated within the organisation's
          own facilities.
      cpu:
        text: cpu
        description: General-purpose central-processing-unit compute capacity.
      gpu:
        text: gpu
        description: Graphics-processing-unit compute capacity, commonly used for
          neural network training and inference.
      tpu:
        text: tpu
        description: Tensor-processing-unit or similar accelerator specialised for
          ML workloads.
      asic:
        text: asic
        description: Application-specific integrated circuit designed for a fixed
          AI workload (Clause 8.7.2).
      fpga:
        text: fpga
        description: Field-programmable gate array offering reconfigurable hardware
          acceleration.
      npu:
        text: npu
        description: Neural-network processing unit specialised for neural-network
          inference and training.
      dsp:
        text: dsp
        description: Digital signal processor used to accelerate signal-processing
          workloads.
  DataModality:
    name: DataModality
    definition_uri: https://w3id.org/lmodel/iso22989/DataModality
    description: Modalities of input data handled by AI systems, drawn from the data,
