    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  AISystemType:
    name: AISystemType
    definition_uri: https://w3id.org/lmodel/iso22989/AISystemType
    description: High-level capability classification of an AI system, from narrow
      (single-task) through general (broad cross-domain) systems and the historical
      strong/weak AI distinction in Clause 5.2.
    in_subset:
    - ai_concepts
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      narrow_ai:
        text: narrow_ai
        description: AI system designed and deployed for a single, well-bounded task.
      general_ai:
        text: general_ai
        description: Hypothetical AI system able to perform any cognitive task a human
          can perform.
      weak_ai:
        text: weak_ai
        description: Historical term largely overlapping with narrow AI; emphasises
          tool-like behaviour.
      strong_ai:
        text: strong_ai
        description: Historical term largely overlapping with general AI; emphasises
          human-equivalent cognition.
  SymbolicApproach:
    name: SymbolicApproach
    definition_uri: https://w3id.org/lmodel/iso22989/SymbolicApproach
    description: The symbolic vs subsymbolic axis used in Clause 5.9 to classify AI
      reasoning techniques.
    in_subset:
    - ai_concepts
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      symbolic:
        text: symbolic
        description: Approaches that manipulate explicit symbolic representations
          (rules, logic, knowledge graphs).
      subsymbolic:
        text: subsymbolic
        description: Approaches that operate on distributed numeric representations
          (neural networks, statistical models).
      hybrid:
        text: hybrid
        description: Approaches that combine symbolic and subsymbolic techniques (neuro-symbolic
          AI).
  MachineLearningParadigm:
    name: MachineLearningParadigm
    definition_uri: https://w3id.org/lmodel/iso22989/MachineLearningParadigm
    description: Top-level machine-learning paradigms enumerated in Clause 5.11.
    in_subset:
    - terminology
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      supervised:
        text: supervised
        description: Learning from labelled input-output examples.
      unsupervised:
        text: unsupervised
        description: Learning structure from unlabelled data (clustering, density
          estimation, dimensionality reduction).
      semi_supervised:
        text: semi_supervised
        description: Learning from a mixture of labelled and unlabelled data.
      reinforcement:
        text: reinforcement
        description: Learning policies by interaction with an environment that issues
          rewards.
      transfer:
        text: transfer
        description: Reusing knowledge learned on one task to accelerate learning
          on a related task.
      self_supervised:
        text: self_supervised
        description: Learning representations from data using auxiliary tasks derived
          from the data itself.
  MLAlgorithmFamily:
    name: MLAlgorithmFamily
    definition_uri: https://w3id.org/lmodel/iso22989/MLAlgorithmFamily
    description: Example machine-learning algorithm families enumerated in Clause
      5.12.
    in_subset:
    - terminology
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      neural_network:
        text: neural_network
        description: Networks of interconnected processing units (artificial neurons)
          trained by gradient methods.
      bayesian_network:
        text: bayesian_network
        description: Probabilistic graphical models encoding conditional dependencies
          between variables.
      decision_tree:
        text: decision_tree
        description: Tree-structured models splitting the input space on feature thresholds.
      support_vector_machine:
        text: support_vector_machine
        description: Margin-maximising classifiers operating in (possibly kernelised)
          feature spaces.
      genetic_algorithm:
        text: genetic_algorithm
        description: Population-based optimisation inspired by biological evolution
          (Clause 5.8).
  AutonomyLevel:
    name: AutonomyLevel
    definition_uri: https://w3id.org/lmodel/iso22989/AutonomyLevel
    description: Degree of system autonomy as discussed in Clause 5.13 (autonomy,
      heteronomy and automation). Encodes both the qualitative axis (autonomous /
      heteronomous / automated) and the six-level operational autonomy gradient widely
      used by ISO/IEC JTC 1/SC 42 work products.
    in_subset:
    - ai_concepts
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      automated:
        text: automated
        description: System executes a fixed predefined behaviour without runtime
          adaptation.
      heteronomous:
        text: heteronomous
        description: System operates under external direction or supervision.
      autonomous:
        text: autonomous
        description: System pursues goals using its own decision-making within a defined
          operating envelope.
      level_0_no_automation:
        text: level_0_no_automation
        description: Human performs all tasks; no autonomous functionality (Clause
          5.13).
      level_1_assistance:
        text: level_1_assistance
        description: System assists the operator with one or more specific tasks.
      level_2_partial_automation:
        text: level_2_partial_automation
        description: System performs some sub-functions; operator retains overall
          control.
      level_3_conditional_automation:
        text: level_3_conditional_automation
        description: System handles defined tasks but expects the operator to intervene
          when requested.
      level_4_high_automation:
        text: level_4_high_automation
        description: System performs the mission within a defined operating envelope
          without operator intervention.
      level_5_full_automation:
        text: level_5_full_automation
        description: System performs the entire mission autonomously across all conditions.
  TrustworthinessPropertyType:
    name: TrustworthinessPropertyType
    definition_uri: https://w3id.org/lmodel/iso22989/TrustworthinessPropertyType
    description: Properties contributing to AI trustworthiness, enumerated in Clause
      5.15 (robustness, reliability, resilience, controllability, explainability,
      predictability, transparency, fairness and bias-related properties).
    in_subset:
    - trustworthiness
    from_schema: https://w3id.org/lmodel/iso22989
    close_mappings:
    - nist_ai_rmf_common:TrustworthinessCharacteristicEnum
    permissible_values:
      robustness:
        text: robustness
        description: Ability to maintain performance under varied or adversarial conditions.
      reliability:
        text: reliability
        description: Consistent intended behaviour over time under stated conditions.
        narrow_mappings:
        - nist_ai_rmf_common:TrustworthinessCharacteristicEnum#VALID_AND_RELIABLE
      resilience:
        text: resilience
        description: Ability to recover acceptable behaviour after disruption or failure.
        narrow_mappings:
        - nist_ai_rmf_common:TrustworthinessCharacteristicEnum#SECURE_AND_RESILIENT
      controllability:
        text: controllability
        description: Property of allowing authorised humans to intervene in system
          behaviour.
      explainability:
        text: explainability
        description: Property of producing explanations of system behaviour that are
          intelligible to relevant audiences.
        narrow_mappings:
        - nist_ai_rmf_common:TrustworthinessCharacteristicEnum#EXPLAINABLE_AND_INTERPRETABLE
      predictability:
        text: predictability
        description: Property of behaviour being anticipatable given known inputs
          and state.
      transparency:
        text: transparency
        description: Property of disclosing meaningful information about the system
          to interested parties.
        narrow_mappings:
        - nist_ai_rmf_common:TrustworthinessCharacteristicEnum#ACCOUNTABLE_AND_TRANSPARENT
      fairness:
        text: fairness
        description: Property of avoiding inappropriate or harmful discrimination
          across groups.
        narrow_mappings:
        - nist_ai_rmf_common:TrustworthinessCharacteristicEnum#FAIR_WITH_HARMFUL_BIAS_MANAGED
      bias_mitigation:
        text: bias_mitigation
        description: Property of identifying and reducing unwanted bias in data, models
          or outcomes.
        narrow_mappings:
        - nist_ai_rmf_common:TrustworthinessCharacteristicEnum#FAIR_WITH_HARMFUL_BIAS_MANAGED
      accountability:
        text: accountability
        description: Property of having identifiable parties answerable for system
          behaviour and outcomes.
        narrow_mappings:
        - nist_ai_rmf_common:TrustworthinessCharacteristicEnum#ACCOUNTABLE_AND_TRANSPARENT
      privacy:
        text: privacy
        description: Property of respecting personal data and individual privacy expectations.
        meaning: nist_ai_rmf_common:TrustworthinessCharacteristicEnum#PRIVACY_ENHANCED
        close_mappings:
        - iso29100:PrivacyPrinciple
        - nist_ai_600_1:GaiRiskCategoryEnum#DATA_PRIVACY
        related_mappings:
        - iso27001:SecurityControl
      safety:
        text: safety
        description: Property of not causing unacceptable risk of harm to people,
          property or environment.
        meaning: nist_ai_rmf_common:TrustworthinessCharacteristicEnum#SAFE
      availability:
        text: availability
        description: Property of being accessible and usable on demand by authorised
          entities (Clause 5.15.3 context).
      integrity:
        text: integrity
        description: Property of safeguarding accuracy and completeness of data, models
          and outputs (Clause 5.15 Note).
        close_mappings:
        - nist_ai_600_1:GaiRiskCategoryEnum#INFORMATION_INTEGRITY
      authenticity:
        text: authenticity
        description: Property of being able to verify the origin and identity of inputs,
          models and outputs (Clause 5.15 Note).
      security:
        text: security
        description: Property of preserving confidentiality, integrity and availability
          of the AI system and its data (Clause 5.15 context).
        close_mappings:
        - nist_ai_600_1:GaiRiskCategoryEnum#INFORMATION_SECURITY
        related_mappings:
        - iso27001:InformationSecurityManagementSystem
        narrow_mappings:
        - nist_ai_rmf_common:TrustworthinessCharacteristicEnum#SECURE_AND_RESILIENT
      usability:
        text: usability
        description: Property of being effectively, efficiently and satisfactorily
          usable by the intended users (Clause 5.15 Note).
      quality:
        text: quality
        description: Aggregate property reflecting how well the AI system meets stated
          and implied needs (Clause 5.15 Note).
      fault_tolerance:
        text: fault_tolerance
        description: Property of continuing to operate correctly in the presence of
          component faults (Clause 5.15.4 context).
  BiasType:
    name: BiasType
    definition_uri: https://w3id.org/lmodel/iso22989/BiasType
    description: Categories of bias relevant to AI systems as discussed in Clause
      5.15.9 and ISO/IEC TR 24027.
    in_subset:
    - trustworthiness
    from_schema: https://w3id.org/lmodel/iso22989
    close_mappings:
    - nist_ai_100_1:BiasCategoryEnum
    narrow_mappings:
    - nist_ai_600_1:GaiRiskCategoryEnum#HARMFUL_BIAS_OR_HOMOGENIZATION
    permissible_values:
      data_bias:
        text: data_bias
        description: Bias introduced through sampling, labelling or representation
          of training data.
      algorithmic_bias:
        text: algorithmic_bias
        description: Bias introduced through model or algorithm choice and parameterisation.
      societal_bias:
        text: societal_bias
        description: Bias reflecting structural inequalities in the data-generating
          environment.
      cognitive_bias:
        text: cognitive_bias
        description: Bias introduced through human cognition during design, labelling
          or interpretation.
      automation_bias:
        text: automation_bias
        description: Tendency of users to over-rely on automated outputs.
  AILifecycleStage:
    name: AILifecycleStage
    definition_uri: https://w3id.org/lmodel/iso22989/AILifecycleStage
    description: AI system life-cycle stages identified in Clause 6.2.
    in_subset:
    - ai_lifecycle
    from_schema: https://w3id.org/lmodel/iso22989
    close_mappings:
    - nist_ai_100_1:AiLifecycleStageEnum
    - nist_ai_600_1:GaiLifecycleStageEnum
    permissible_values:
      inception:
        text: inception
        description: Identification of need, opportunity and high-level objectives
          for the AI system.
        close_mappings:
        - nist_ai_600_1:GaiLifecycleStageEnum#DESIGN
      design_and_development:
        text: design_and_development
        description: Architecture, model selection, data preparation, training and
          integration activities.
        close_mappings:
        - nist_ai_600_1:GaiLifecycleStageEnum#DEVELOPMENT
      verification_and_validation:
        text: verification_and_validation
        description: Evidence-gathering activities establishing that the system meets
          specified requirements.
      deployment:
        text: deployment
        description: Release of the AI system into its operational environment.
        meaning: nist_ai_600_1:GaiLifecycleStageEnum#DEPLOYMENT
      operation_and_monitoring:
        text: operation_and_monitoring
        description: Routine use of the AI system with ongoing observation of behaviour
          and performance.
        close_mappings:
        - nist_ai_600_1:GaiLifecycleStageEnum#OPERATION
      continuous_validation:
        text: continuous_validation
        description: Ongoing checks that the system continues to meet validation criteria
          during operation.
      re_evaluation:
        text: re_evaluation
        description: Periodic or event-triggered reassessment of the system, often
          leading to retraining or redesign.
      retirement:
        text: retirement
        description: Decommissioning of the AI system and management of residual data
          and artefacts.
        meaning: nist_ai_600_1:GaiLifecycleStageEnum#DECOMMISSIONING
  AIFunctionalComponent:
    name: AIFunctionalComponent
