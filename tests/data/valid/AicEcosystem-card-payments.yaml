    title: Training cluster
    aic_pool_kind: cloud
    aic_pool_hardware: Graphics accelerators
    aic_pool_capacity: 64 accelerators
aic_ecosystem_iot_devices:
  - aic_id: ex:door-sensor
    title: Door sensor
    aic_device_senses:
      - Whether a door is open.
  - aic_id: ex:door-lock
    title: Door lock
    aic_device_actuates:
      - The lock on a door.
aic_ecosystem_iot_systems:
  - aic_id: ex:building
    title: Building access
    aic_iot_devices:
