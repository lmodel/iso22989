---
aic_id: ex:eco
title: Card payments
description: The AI systems a bank runs on card payments.
aic_ecosystem_systems:
  - aic_id: ex:fraud-screen
    title: Payment fraud screen
    aic_system_type: AicSystem
    description: Scores card payments and holds the doubtful ones for review.
    aic_system_purpose: Stop dishonest card payments before they settle.
    aic_system_scope: narrow_ai
    aic_system_approaches:
      - subsymbolic
    aic_system_techniques:
      - machine_learning
    aic_system_automated: true
    aic_system_autonomy: heteronomous
    aic_system_human_teaming: An analyst reviews each payment the system holds.
    aic_system_stage: operation_and_monitoring
    aic_system_fields:
      - data_mining
    aic_system_steps:
      - data_and_information
      - prediction
      - decision
      - action
    aic_system_components:
      - ex:scorer
    aic_system_models:
      - ex:fraud-model
    aic_system_datasets:
      - ex:payments-2025
    aic_system_tasks:
      - ex:score-payment
    aic_system_stakeholders:
      - ex:bank
      - ex:cardholders
    aic_system_resource_pools:
      - ex:gpu-pool
    aic_system_jurisdictional_issues:
      - Payment records may not leave the country they were made in.
    aic_system_societal_impacts:
      - A wrongly held payment can leave a person short of money.
  - aic_id: ex:agent
    title: Trading agent
    aic_system_type: AicAgent
    aic_agent_goals:
      - Keep the portfolio within its limits.
    aic_agent_environment: A simulated market.
  - aic_id: ex:expert
    title: Claims adviser
    aic_system_type: AicExpertSystem
    aic_expert_knowledge:
      - ex:fraud-rules
    aic_expert_inference: Forward chaining over the rules.
  - aic_id: ex:robot
    title: Warehouse picker
    aic_system_type: AicRobot
    aic_robot_actuators:
      - A gripper arm.
    aic_robot_sensors:
      - A depth camera.
aic_ecosystem_components:
  - aic_id: ex:scorer
    title: Scorer
    aic_component_step: prediction
    aic_component_depends_on:
      - ex:feature-store
  - aic_id: ex:feature-store
    title: Feature store
    aic_component_step: data_and_information
aic_ecosystem_knowledge:
  - aic_id: ex:fraud-rules
    title: Fraud rules
    aic_knowledge_kind: procedural
    aic_knowledge_representation: Rules an analyst can read.
aic_ecosystem_tasks:
  - aic_id: ex:score-payment
    title: Score a payment
    aic_task_goal: Give each payment a score for how likely it is to be dishonest.
    aic_task_performance_measures:
      - false positive rate
  - aic_id: ex:translate-claims
    title: Translate claims
    aic_task_kind: machine_translation
    aic_task_languages:
      - en
      - fr-CA
aic_ecosystem_models:
  - aic_id: ex:fraud-rulebook
    title: Fraud rulebook
    aic_model_type: AicModel
    aic_model_version: '3'
    aic_model_represents: How analysts tell dishonest payments apart.
  - aic_id: ex:fraud-model-6
    title: Fraud model 6
    aic_model_type: AicMachineLearningModel
    aic_model_version: '6'
    aic_ml_paradigm: supervised
  - aic_id: ex:fraud-model
    title: Fraud model
    aic_model_type: AicMachineLearningModel
    aic_model_version: '7'
    aic_ml_paradigm: supervised
    aic_ml_algorithm: decision_tree
    aic_ml_datasets:
      - ex:payments-2025
    aic_ml_hyperparameters:
      - max_depth=12
    aic_ml_parameter_count: 4096
    aic_ml_trained_on: '2026-02-01'
    aic_ml_retrained_from: ex:fraud-model-6
    aic_ml_continuous_learning: false
  - aic_id: ex:claims-network
    title: Claims network
    aic_model_type: AicNeuralNetworkModel
    aic_ml_paradigm: supervised
    aic_ml_algorithm: neural_network
    aic_network_architecture: recurrent
    aic_network_layer_count: 4
    aic_network_activation_functions:
      - tanh
aic_ecosystem_datasets:
  - aic_id: ex:payments-2025
    title: Payments of 2025
    aic_dataset_roles:
      - training
      - validation
    aic_dataset_source: The bank's payment ledger.
    aic_dataset_sample_count: 1200000
    aic_dataset_labels:
      - honest
      - dishonest
    aic_dataset_ground_truth: Chargebacks confirmed by the card scheme.
    aic_dataset_holds_pii: true
    aic_dataset_processes:
      - aic_data_process_kind: data_quality_checking
        aic_data_process_method: A script that counts empty fields.
        aic_data_process_date: '2026-01-15'
aic_ecosystem_stakeholders:
  - aic_id: ex:bank
    title: The bank
    aic_stakeholder_role: ai_producer
    aic_stakeholder_sub_roles:
      - ai_developer
    aic_stakeholder_organization: Example Bank
    aic_stakeholder_contact: https://example.org/contact
    aic_stakeholder_responsibilities:
      - Keeps the model current.
  - aic_id: ex:cardholders
    title: Cardholders
    aic_stakeholder_role: ai_subject
    aic_stakeholder_sub_roles:
      - data_subject
aic_ecosystem_lifecycle_processes:
  - aic_id: ex:release-7
    title: Release of model 7
    aic_lifecycle_stage: deployment
    aic_lifecycle_system: ex:fraud-screen
    aic_lifecycle_inputs:
      - The signed-off model.
    aic_lifecycle_outputs:
      - The model in service.
    aic_lifecycle_responsible: ex:bank
    aic_lifecycle_start: '2026-02-11'
    aic_lifecycle_end: '2026-02-12'
aic_ecosystem_claims:
  - aic_id: ex:claim-robust
    title: Holds up under a surge
    aic_claim_system: ex:fraud-screen
    aic_claim_property: robustness
    aic_claim_evidence:
      - A load test at ten times the normal rate.
    aic_claim_measure: False positive rate during the test.
aic_ecosystem_assessments:
  - aic_id: ex:assess-1
    title: Pre-release check
    aic_assessment_kind: verification
    aic_assessment_system: ex:fraud-screen
    aic_assessment_method: Replayed a year of payments.
    aic_assessment_result: Met the specified false positive rate.
    aic_assessment_date: '2026-02-10'
aic_ecosystem_predictions:
  - aic_id: ex:pred-1
    title: Score for payment 1
    aic_prediction_system: ex:fraud-screen
    aic_prediction_value: '0.93'
    aic_prediction_confidence: 0.8
aic_ecosystem_decisions:
  - aic_id: ex:dec-1
    title: Hold payment 1
    aic_decision_outcome: Hold the payment for review.
    aic_decision_predictions:
      - ex:pred-1
    aic_decision_criteria: Hold anything scored over 0.9.
aic_ecosystem_actions:
  - aic_id: ex:act-1
    title: Payment 1 held
    aic_action_decision: ex:dec-1
    aic_action_target: Payment 1
    aic_action_time: '2026-03-01T10:15:00Z'
aic_ecosystem_applications:
  - aic_id: ex:fraud-app
    title: Card fraud screening
    aic_application_system: ex:fraud-screen
    aic_application_domain: fraud_detection
    aic_application_sector: Retail banking
    aic_application_purpose: Screen card payments.
aic_ecosystem_resource_pools:
