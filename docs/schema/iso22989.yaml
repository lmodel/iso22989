      iso22989_term:
        tag: iso22989_term
        value: 3.1.4
      iso22989_clause:
        tag: iso22989_clause
        value: '8.2'
    description: A system built to produce results for goals set by people, using
      AI techniques, whatever else it is made of.
    comments:
    - gist's System is any composite whose parts work as a whole, so it is the wider
      term. SPDX's AIPackage describes a system as a distributed package.
    - NIST's AI system, as lmodel/nist-ai-100-1 renders it, is a machine-based system
      that produces outputs for given objectives, a definition NIST adapts from the
      OECD's, so the two are close.
