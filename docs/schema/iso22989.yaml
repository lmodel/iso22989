  AicStakeholder:
    name: AicStakeholder
    definition_uri: https://w3id.org/lmodel/iso22989/AicStakeholder
    annotations:
      iso22989_term:
        tag: iso22989_term
        value: 3.5.13
      iso22989_clause:
        tag: iso22989_clause
        value: 5.19.1
    description: A person, group or organization with a part in an AI system or an
      interest in it.
    comments:
    - UCO's Role is the function something has in context, which this record states
      for one party. A party with two roles has a record for each.
    - The rules hold each sub-role to the role its role annotation names, so a validator
      refuses a sub-role of another role. tests/test_data.py holds the rules and the
      annotations equal.
    in_subset:
    - aic_stakeholders
    from_schema: https://w3id.org/lmodel/iso22989
    related_mappings:
    - uco-role:Role
    mixins:
    - AicRecordMixin
    slots:
    - aicStakeholder__aic_stakeholder_role
    - aicStakeholder__aic_stakeholder_sub_roles
    - aicStakeholder__aic_stakeholder_organization
    - aicStakeholder__aic_stakeholder_contact
    - aicStakeholder__aic_stakeholder_responsibilities
    - aic_id
    - AicRecordMixin_title
    - description
    attributes:
      aic_stakeholder_role:
        name: aic_stakeholder_role
        description: The part the party plays.
        range: AicStakeholderRole
        required: true
      aic_stakeholder_sub_roles:
        name: aic_stakeholder_sub_roles
        description: The narrower parts it plays within that role.
        range: AicStakeholderSubRole
        multivalued: true
      aic_stakeholder_organization:
        name: aic_stakeholder_organization
        description: The organization the party is or belongs to.
      aic_stakeholder_contact:
        name: aic_stakeholder_contact
        description: How to reach the party.
      aic_stakeholder_responsibilities:
        name: aic_stakeholder_responsibilities
        description: What the party answers for.
        multivalued: true
    class_uri: iso22989:AicStakeholder
    rules:
    - preconditions:
        slot_conditions:
          aic_stakeholder_role:
            name: aic_stakeholder_role
            equals_string: ai_provider
          aic_stakeholder_sub_roles:
            name: aic_stakeholder_sub_roles
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          aic_stakeholder_sub_roles:
            name: aic_stakeholder_sub_roles
            any_of:
            - equals_string: ai_platform_provider
            - equals_string: ai_product_or_service_provider
      description: A party in the ai_provider role takes only that role's sub-roles.
    - preconditions:
        slot_conditions:
          aic_stakeholder_role:
            name: aic_stakeholder_role
            equals_string: ai_producer
          aic_stakeholder_sub_roles:
            name: aic_stakeholder_sub_roles
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          aic_stakeholder_sub_roles:
            name: aic_stakeholder_sub_roles
            any_of:
            - equals_string: ai_developer
      description: A party in the ai_producer role takes only that role's sub-roles.
    - preconditions:
        slot_conditions:
          aic_stakeholder_role:
            name: aic_stakeholder_role
            equals_string: ai_customer
          aic_stakeholder_sub_roles:
            name: aic_stakeholder_sub_roles
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          aic_stakeholder_sub_roles:
            name: aic_stakeholder_sub_roles
            any_of:
            - equals_string: ai_user
      description: A party in the ai_customer role takes only that role's sub-roles.
    - preconditions:
        slot_conditions:
          aic_stakeholder_role:
            name: aic_stakeholder_role
            equals_string: ai_partner
          aic_stakeholder_sub_roles:
            name: aic_stakeholder_sub_roles
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          aic_stakeholder_sub_roles:
            name: aic_stakeholder_sub_roles
            any_of:
            - equals_string: ai_system_integrator
            - equals_string: data_provider
      description: A party in the ai_partner role takes only that role's sub-roles.
    - preconditions:
        slot_conditions:
          aic_stakeholder_role:
            name: aic_stakeholder_role
            equals_string: ai_subject
          aic_stakeholder_sub_roles:
            name: aic_stakeholder_sub_roles
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          aic_stakeholder_sub_roles:
            name: aic_stakeholder_sub_roles
            any_of:
            - equals_string: data_subject
            - equals_string: other_subject
      description: A party in the ai_subject role takes only that role's sub-roles.
    - preconditions:
        slot_conditions:
          aic_stakeholder_role:
            name: aic_stakeholder_role
            equals_string: relevant_authority
          aic_stakeholder_sub_roles:
            name: aic_stakeholder_sub_roles
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          aic_stakeholder_sub_roles:
            name: aic_stakeholder_sub_roles
            any_of:
            - equals_string: policy_maker
            - equals_string: regulator
      description: A party in the relevant_authority role takes only that role's sub-roles.
