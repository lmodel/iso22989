name: iso22989
annotations:
  standard:
    tag: standard
    value: ISO/IEC 22989:2022
  edition:
    tag: edition
    value: '1'
  publication_date:
    tag: publication_date
    value: '2022-07-19'
  iso_open_data_date:
    tag: iso_open_data_date
    value: '2026-11-05'
description: 'A LinkML vocabulary for describing an AI system in the terms of ISO/IEC
  22989:2022: the system and its kinds, its models, data and tasks, its place in the
  life cycle, the parties around it, the trustworthiness claims made for it, and the
  fields and applications it belongs to.'
title: ISO/IEC 22989:2022 AI concepts and terminology
comments:
- The version is the edition the schema models, and source is ISO's page for that
  edition. ISO Open Data's records of it and of the two amendments in progress are
  copied to src/iso22989/schema/iso-open-data/ as of the date in the annotations,
  and scripts/check_upstream_release.py reports when ISO publishes one of them or
  another edition. The release tags are the schema's own versions.
- ISO/IEC 22989 is copyright ISO and IEC, and none of its text is reproduced here.
  Each element cites what it renders by number, in the iso22989_term annotation for
  a term of Clause 3 and the iso22989_clause annotation for a clause, and its description
  is this project's own words. A reader with a licensed copy looks the standard's
  wording up there by those numbers.
- tests/iso22989_numbers.yaml lists every term number and says which element renders
  it, or why none does.
- Every record that other records refer to has an aic_id, and a reference holds that
  identifier. AicEcosystem holds each kind of record in a list of its own.
source: https://www.iso.org/standard/74296.html
see_also:
- https://lmodel.github.io/iso22989
- https://www.iso.org/standard/74296.html
id: https://w3id.org/lmodel/iso22989
version: '2022'
imports:
- linkml:types
license: Apache-2.0
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  iso22989:
    prefix_prefix: iso22989
    prefix_reference: https://w3id.org/lmodel/iso22989/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  gist_ontology:
    prefix_prefix: gist_ontology
    prefix_reference: https://w3id.org/semanticarts/ns/ontology/gist/
  nist_ai_100_1:
    prefix_prefix: nist_ai_100_1
    prefix_reference: https://w3id.org/lmodel/nist-ai-100-1/
  spdx_ai:
    prefix_prefix: spdx_ai
    prefix_reference: https://spdx.org/rdf/3.0.1/terms/AI/
  spdx_dataset:
    prefix_prefix: spdx_dataset
    prefix_reference: https://spdx.org/rdf/3.0.1/terms/Dataset/
  uco-observable:
    prefix_prefix: uco-observable
    prefix_reference: https://ontology.unifiedcyberontology.org/uco/observable/
  uco-role:
    prefix_prefix: uco-role
    prefix_reference: https://ontology.unifiedcyberontology.org/uco/role/
default_prefix: iso22989
default_range: string
subsets:
  aic_systems:
    name: aic_systems
    definition_uri: https://w3id.org/lmodel/iso22989/AicSystems
    description: AI systems, their kinds and their parts (clauses 5.1 to 5.9, 5.13
      and 8.2).
    from_schema: https://w3id.org/lmodel/iso22989
  aic_data:
    name: aic_data
    definition_uri: https://w3id.org/lmodel/iso22989/AicData
    description: Datasets and the work done on them (clauses 5.10 and 8.6).
    from_schema: https://w3id.org/lmodel/iso22989
  aic_machine_learning:
    name: aic_machine_learning
    definition_uri: https://w3id.org/lmodel/iso22989/AicMachineLearning
    description: Models and how they learn (clauses 5.11, 5.12 and 8.4).
    from_schema: https://w3id.org/lmodel/iso22989
  aic_iot:
    name: aic_iot
    definition_uri: https://w3id.org/lmodel/iso22989/AicIot
    description: Connected devices and physical systems (clause 5.14).
    from_schema: https://w3id.org/lmodel/iso22989
  aic_trustworthiness:
    name: aic_trustworthiness
    definition_uri: https://w3id.org/lmodel/iso22989/AicTrustworthiness
    description: Claims about an AI system and checks on it (clauses 5.15 and 5.16).
    from_schema: https://w3id.org/lmodel/iso22989
  aic_stakeholders:
    name: aic_stakeholders
    definition_uri: https://w3id.org/lmodel/iso22989/AicStakeholders
    description: The parties around an AI system (clause 5.19).
    from_schema: https://w3id.org/lmodel/iso22989
  aic_lifecycle:
    name: aic_lifecycle
    definition_uri: https://w3id.org/lmodel/iso22989/AicLifecycle
    description: The stages of an AI system's life and the work in each (clause 6).
    from_schema: https://w3id.org/lmodel/iso22989
  aic_functional_view:
    name: aic_functional_view
    definition_uri: https://w3id.org/lmodel/iso22989/AicFunctionalView
    description: How a system moves from data to acting on its results (clause 7).
    from_schema: https://w3id.org/lmodel/iso22989
  aic_ecosystem:
    name: aic_ecosystem
    definition_uri: https://w3id.org/lmodel/iso22989/AicEcosystem
    description: What surrounds AI systems, such as computing resources (clause 8).
    from_schema: https://w3id.org/lmodel/iso22989
  aic_fields_and_applications:
    name: aic_fields_and_applications
    definition_uri: https://w3id.org/lmodel/iso22989/AicFieldsAndApplications
    description: The fields of AI and where systems are applied (clauses 9 and 10).
    from_schema: https://w3id.org/lmodel/iso22989
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  AicSystemScope:
    name: AicSystemScope
    definition_uri: https://w3id.org/lmodel/iso22989/AicSystemScope
    annotations:
      iso22989_clause:
        tag: iso22989_clause
        value: '5.2'
    description: How wide a range of problems a system can take on.
    in_subset:
    - aic_systems
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      narrow_ai:
        text: narrow_ai
        description: Built for a bounded set of problems, and cannot move beyond them.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.1.24
      general_ai:
        text: general_ai
        description: Able to take on problems of many kinds, including ones it was
          not built for.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.1.14
  AicApproach:
    name: AicApproach
    definition_uri: https://w3id.org/lmodel/iso22989/AicApproach
    annotations:
      iso22989_clause:
        tag: iso22989_clause
        value: '5.9'
    description: Whether a system works on explicit symbols or on learned numeric
      encodings.
    in_subset:
    - aic_systems
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      symbolic:
        text: symbolic
        description: Works by manipulating explicit symbols and the rules that relate
          them.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.1.33
      subsymbolic:
        text: subsymbolic
        description: Works on numeric encodings that carry meaning only as a whole,
          such as the weights of a network.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.1.34
  AicTechnique:
    name: AicTechnique
    definition_uri: https://w3id.org/lmodel/iso22989/AicTechnique
    description: A family of techniques a system is built with.
    in_subset:
    - aic_systems
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      machine_learning:
        text: machine_learning
        description: Fits a model's numbers to data rather than having a person write
          the logic.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.3.5
          iso22989_clause:
            tag: iso22989_clause
            value: '5.11'
      deep_learning:
        text: deep_learning
        description: Machine learning that stacks many layers of a network.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.4.4
      cognitive_computing:
        text: cognitive_computing
        description: Aims at interaction with people that feels closer to how people
          deal with one another.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.1.8
          iso22989_clause:
            tag: iso22989_clause
            value: '5.5'
      semantic_computing:
        text: semantic_computing
        description: Works out what content and requests mean, so that it can act
          on the meaning.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.1.31
          iso22989_clause:
            tag: iso22989_clause
            value: '5.6'
      soft_computing:
        text: soft_computing
        description: Accepts inexact or uncertain reasoning where an exact answer
          would cost too much.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.1.32
          iso22989_clause:
            tag: iso22989_clause
            value: '5.7'
      genetic_algorithm:
        text: genetic_algorithm
        description: Searches by breeding and selecting candidate answers over many
          generations.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.1.15
          iso22989_clause:
            tag: iso22989_clause
            value: '5.8'
      logic_programming:
        text: logic_programming
        description: States facts and rules in logic, and lets a solver reach the
          conclusions.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: 8.5.3
  AicAutonomy:
    name: AicAutonomy
    definition_uri: https://w3id.org/lmodel/iso22989/AicAutonomy
    annotations:
      iso22989_clause:
        tag: iso22989_clause
        value: '5.13'
    description: Whether a system can change its own remit or stays under outside
      direction.
    in_subset:
    - aic_systems
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      autonomous:
        text: autonomous
        description: Can change what it is for or where it applies with nobody directing
          it.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.1.5
      heteronomous:
        text: heteronomous
        description: Stays under the direction of a person or another system.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.1.16
  AicKnowledgeKind:
    name: AicKnowledgeKind
    definition_uri: https://w3id.org/lmodel/iso22989/AicKnowledgeKind
    annotations:
      iso22989_clause:
        tag: iso22989_clause
        value: '5.4'
    description: Whether a body of knowledge states facts or steps.
    in_subset:
    - aic_systems
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      declarative:
        text: declarative
        description: States what is the case.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.1.12
      procedural:
        text: procedural
        description: States what to do, step by step.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.1.28
  AicFunctionalStep:
    name: AicFunctionalStep
    definition_uri: https://w3id.org/lmodel/iso22989/AicFunctionalStep
    annotations:
      iso22989_clause:
        tag: iso22989_clause
        value: '7'
    description: A step in how a system gets from data to acting on its results.
    in_subset:
    - aic_functional_view
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      data_and_information:
        text: data_and_information
        description: Taking in data and giving it meaning.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: '7.2'
      knowledge_and_learning:
        text: knowledge_and_learning
        description: Building up what the system knows, and learning from more data.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: '7.3'
      prediction:
        text: prediction
        description: Working out a likely result for the case in hand.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: 7.4.2
      decision:
        text: decision
        description: Choosing what to do, given the results so far.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: 7.4.3
      action:
        text: action
        description: Carrying out what was chosen.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: 7.4.4
  AicLearningParadigm:
    name: AicLearningParadigm
    definition_uri: https://w3id.org/lmodel/iso22989/AicLearningParadigm
    annotations:
      iso22989_clause:
        tag: iso22989_clause
        value: '5.11'
    description: How a model learns from its data.
    in_subset:
    - aic_machine_learning
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      supervised:
        text: supervised
        description: Every example comes with the answer it should give.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.3.12
          iso22989_clause:
            tag: iso22989_clause
            value: 5.11.1
      unsupervised:
        text: unsupervised
        description: No example comes with an answer, so the model looks for structure.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.3.17
          iso22989_clause:
            tag: iso22989_clause
            value: 5.11.2
      semi_supervised:
        text: semi_supervised
        description: Some examples come with answers and the rest do not.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.3.11
          iso22989_clause:
            tag: iso22989_clause
            value: 5.11.3
      reinforcement:
        text: reinforcement
        description: The model acts, gets a reward or penalty, and adjusts to earn
          more reward.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.3.9
          iso22989_clause:
            tag: iso22989_clause
            value: 5.11.4
      transfer:
        text: transfer
        description: What was learned on one problem gives a start on another.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: 5.11.5
  AicAlgorithmFamily:
    name: AicAlgorithmFamily
    definition_uri: https://w3id.org/lmodel/iso22989/AicAlgorithmFamily
    annotations:
      iso22989_term:
        tag: iso22989_term
        value: 3.3.6
      iso22989_clause:
        tag: iso22989_clause
        value: '5.12'
    description: A family of algorithms that fit machine learning models.
    in_subset:
