            value: 5.19.7
  AicStakeholderSubRole:
    name: AicStakeholderSubRole
    definition_uri: https://w3id.org/lmodel/iso22989/AicStakeholderSubRole
    description: A narrower part within one of the roles.
    comments:
    - Each value's role annotation names the role it sits under. The list is open,
      so a party whose part is not named here states its role alone.
    - lmodel/iso42001 names nine more parts under the AI producer role, from clause
      4.1 of ISO/IEC 42001:2023. Only a copy of each standard can settle which parts
      each one names.
    in_subset:
    - aic_stakeholders
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      ai_platform_provider:
        text: ai_platform_provider
        description: Offers the platform that others run AI on.
        annotations:
          role:
            tag: role
            value: ai_provider
      ai_product_or_service_provider:
        text: ai_product_or_service_provider
        description: Offers a finished AI product or a service built on AI.
        annotations:
          role:
            tag: role
            value: ai_provider
      ai_developer:
        text: ai_developer
        description: Writes and builds the system.
        annotations:
          role:
            tag: role
            value: ai_producer
      ai_user:
        text: ai_user
        description: Uses the system directly.
        annotations:
          role:
            tag: role
            value: ai_customer
      ai_system_integrator:
        text: ai_system_integrator
        description: Fits AI parts into a larger system.
        annotations:
          role:
            tag: role
            value: ai_partner
      data_provider:
        text: data_provider
        description: Supplies data that others build or run on.
        annotations:
          role:
            tag: role
            value: ai_partner
      data_subject:
        text: data_subject
        description: A person the data is about.
        annotations:
          role:
            tag: role
            value: ai_subject
      other_subject:
        text: other_subject
        description: Anyone else a system affects.
        annotations:
          role:
            tag: role
            value: ai_subject
      policy_maker:
        text: policy_maker
        description: Decides policy on AI.
        annotations:
          role:
            tag: role
            value: relevant_authority
      regulator:
        text: regulator
        description: Holds others to the rules on AI.
        annotations:
          role:
            tag: role
            value: relevant_authority
  AicLifecycleStage:
    name: AicLifecycleStage
    definition_uri: https://w3id.org/lmodel/iso22989/AicLifecycleStage
    annotations:
      iso22989_term:
        tag: iso22989_term
        value: 3.1.22
      iso22989_clause:
        tag: iso22989_clause
        value: '6.2'
    description: A stage in an AI system's life.
    comments:
    - The related_mappings pair each stage with the OECD phase it answers to. Annex
      A of the standard sets the two accounts side by side, and this project has not
      checked the pairing against it; the retirement row rests on the OECD's text
      alone.
    in_subset:
    - aic_lifecycle
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      inception:
        text: inception
        description: Deciding that a system is wanted, what it is for and whether
          it can be done.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: 6.2.2
        related_mappings:
        - iso22989:AicOecdLifecycleStage#plan_and_design
      design_and_development:
        text: design_and_development
        description: Making the system, from its architecture through its data work
          to its models.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: 6.2.3
        related_mappings:
        - iso22989:AicOecdLifecycleStage#collect_and_process_data
        - iso22989:AicOecdLifecycleStage#build_and_use_model
      verification_and_validation:
        text: verification_and_validation
        description: Checking what was made against its specification and against
          its purpose.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: 6.2.4
        related_mappings:
        - iso22989:AicOecdLifecycleStage#verify_and_validate
      deployment:
        text: deployment
        description: Installing the system where it is to run, and making it ready
          for use.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: 6.2.5
        related_mappings:
        - iso22989:AicOecdLifecycleStage#deploy
      operation_and_monitoring:
        text: operation_and_monitoring
        description: Running the system and keeping an eye on how it behaves.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: 6.2.6
        related_mappings:
        - iso22989:AicOecdLifecycleStage#operate_and_monitor
      continuous_validation:
        text: continuous_validation
        description: Repeating the checks on a system that goes on learning as it
          runs.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: 6.2.7
        related_mappings:
        - iso22989:AicOecdLifecycleStage#operate_and_monitor
      re_evaluation:
        text: re_evaluation
        description: Looking again at whether the running system still meets its aims.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: 6.2.8
        related_mappings:
        - iso22989:AicOecdLifecycleStage#operate_and_monitor
      retirement:
        text: retirement
        description: Taking the system out of use.
        annotations:
          iso22989_clause:
            tag: iso22989_clause
            value: 6.2.9
        related_mappings:
        - iso22989:AicOecdLifecycleStage#retire_or_decommission
  AicOecdLifecycleStage:
    name: AicOecdLifecycleStage
    definition_uri: https://w3id.org/lmodel/iso22989/AicOecdLifecycleStage
    annotations:
      iso22989_clause:
        tag: iso22989_clause
        value: Annex A
      oecd_source:
        tag: oecd_source
        value: OECD/LEGAL/0449
    description: A phase of the OECD's account of an AI system's life, which Annex
      A sets beside the standard's.
    comments:
    - 'The first six values are the phases the OECD Recommendation on Artificial Intelligence
      (OECD/LEGAL/0449) named when the standard was published, as the OECD Framework
      for the Classification of AI Systems (2022) draws them. The Recommendation as
      revised on 3 May 2024 names seven: it adds retiring or decommissioning, widens
      building to adapting a model that exists, and widens checking to testing and
      evaluation. The descriptions follow the revised text, read at legalinstruments.oecd.org
      on 2026-11-05, and retire_or_decommission is here for a record that follows
      it.'
    - NIST's AI Risk Management Framework names the first six phases too, with deploy
      as deploy and use, and lmodel/nist-ai-100-1 renders them, so each maps to NIST's
      stage by close_mappings.
    in_subset:
    - aic_lifecycle
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      plan_and_design:
        text: plan_and_design
        description: Setting out what the system is for and how it will work.
        close_mappings:
        - nist_ai_100_1:AiRmfLifecycleStageName#plan_and_design
      collect_and_process_data:
        text: collect_and_process_data
        description: Gathering and readying the data.
        close_mappings:
        - nist_ai_100_1:AiRmfLifecycleStageName#collect_and_process_data
      build_and_use_model:
        text: build_and_use_model
        description: Making the model, or adapting one that exists, and trying it
          on the task.
        close_mappings:
        - nist_ai_100_1:AiRmfLifecycleStageName#build_and_use_model
      verify_and_validate:
        text: verify_and_validate
        description: Testing and evaluating the system, and checking it against what
          was specified and what it is for.
        close_mappings:
        - nist_ai_100_1:AiRmfLifecycleStageName#verify_and_validate
      deploy:
        text: deploy
        description: Making the system available for use.
        close_mappings:
        - nist_ai_100_1:AiRmfLifecycleStageName#deploy_and_use
      operate_and_monitor:
        text: operate_and_monitor
        description: Running the system and watching how it behaves.
        close_mappings:
        - nist_ai_100_1:AiRmfLifecycleStageName#operate_and_monitor
      retire_or_decommission:
        text: retire_or_decommission
        description: Taking the system out of service, a step that may come at any
          point while it runs.
