  AicTrustworthinessProperty:
    name: AicTrustworthinessProperty
    definition_uri: https://w3id.org/lmodel/iso22989/AicTrustworthinessProperty
    annotations:
      iso22989_clause:
        tag: iso22989_clause
        value: '5.15'
    description: A property a trustworthiness claim is about.
    comments:
    - 'Where a characteristic of NIST''s AI Risk Management Framework, as lmodel/nist-ai-100-1
      renders it, holds a property, the value maps to it: broad where NIST joins the
      property with another, close for fairness.'
    in_subset:
    - aic_trustworthiness
    from_schema: https://w3id.org/lmodel/iso22989
    permissible_values:
      robustness:
        text: robustness
        description: Keeps performing well when conditions turn hostile or unusual.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.5.12
          iso22989_clause:
            tag: iso22989_clause
            value: 5.15.2
      reliability:
        text: reliability
        description: Behaves and delivers as intended, time after time.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.5.9
          iso22989_clause:
            tag: iso22989_clause
            value: 5.15.3
        broad_mappings:
        - nist_ai_100_1:AiRmfCharacteristicName#valid_and_reliable
      resilience:
        text: resilience
        description: Gets back to working order soon after something goes wrong.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.5.10
          iso22989_clause:
            tag: iso22989_clause
            value: 5.15.4
        broad_mappings:
        - nist_ai_100_1:AiRmfCharacteristicName#secure_and_resilient
      controllability:
        text: controllability
        description: A person or another system can step in and steer it.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.5.5, 3.5.6
          iso22989_clause:
            tag: iso22989_clause
            value: 5.15.5
      explainability:
        text: explainability
        description: Can say, in terms people follow, what drove a result.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.5.7
          iso22989_clause:
            tag: iso22989_clause
            value: 5.15.6
        broad_mappings:
        - nist_ai_100_1:AiRmfCharacteristicName#explainable_and_interpretable
      predictability:
        text: predictability
        description: Lets people form sound expectations of what it will produce.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.5.8
          iso22989_clause:
            tag: iso22989_clause
            value: 5.15.7
      organizational_transparency:
        text: organizational_transparency
        description: The organization tells those concerned what it does and decides.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.5.14
          iso22989_clause:
            tag: iso22989_clause
            value: 5.15.8
        broad_mappings:
        - nist_ai_100_1:AiRmfCharacteristicName#accountable_and_transparent
      system_transparency:
        text: system_transparency
        description: Those concerned can learn what they need to know about the system.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.5.15
          iso22989_clause:
            tag: iso22989_clause
            value: 5.15.8
        broad_mappings:
        - nist_ai_100_1:AiRmfCharacteristicName#accountable_and_transparent
      bias_and_fairness:
        text: bias_and_fairness
        description: Whether the system treats some people or things worse than others,
          as a pattern.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.5.4
          iso22989_clause:
            tag: iso22989_clause
            value: 5.15.9
        close_mappings:
        - nist_ai_100_1:AiRmfCharacteristicName#fair_with_harmful_bias_managed
      accountability:
        text: accountability
        description: Someone answers for what the system does and decides.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.5.1, 3.5.2
        broad_mappings:
        - nist_ai_100_1:AiRmfCharacteristicName#accountable_and_transparent
      availability:
        text: availability
        description: Those entitled to use it can reach it and use it when they ask.
        annotations:
          iso22989_term:
            tag: iso22989_term
            value: 3.5.3
  AicAssessmentKind:
    name: AicAssessmentKind
    definition_uri: https://w3id.org/lmodel/iso22989/AicAssessmentKind
    annotations:
