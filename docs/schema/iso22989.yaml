  AicRecordMixin:
    name: AicRecordMixin
    definition_uri: https://w3id.org/lmodel/iso22989/AicRecordMixin
    description: 'What every record has, so that other records can refer to it: an
      identifier, a title and a description.'
    comments:
    - It is a mixin, not a base class, so that the adapt copy can re-root some record
      classes on LOKF's Concept and leave the others as they are. lokf adapt replaces
      aic_id with LOKF's id, and a class that declares id itself must descend from
      Concept.
    from_schema: https://w3id.org/lmodel/iso22989
    mixin: true
    slots:
    - aic_id
    - AicRecordMixin_title
    - description
    slot_usage:
      title:
        name: title
        required: true
        pattern: ^\s*\S
    class_uri: iso22989:AicRecordMixin
